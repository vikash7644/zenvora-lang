[package]
name = "zenvora"
version = "0.8.0"
edition = "2021"
description = "Zenvora Lang compiler and bytecode virtual machine"
license = "MIT"
homepage = "https://vikash7644.github.io/zenvora-lang/"
repository = "https://github.com/vikash7644/zenvora-lang"
readme = "README.md"
keywords = ["programming-language", "compiler", "virtual-machine"]
categories = ["command-line-utilities", "development-tools"]
default-run = "zv"
include = ["src/**", "compiler/parser.zv", "compiler/token_stream.zv", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE*", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "docs/**", "examples/**", "tests/**"]

[[bin]]
name = "zv"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
ed25519-dalek = "2"
getrandom = "0.2"
serde_json = "1"
