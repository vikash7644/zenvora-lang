name: Zenvora clean-environment bootstrap baseline
on:
  pull_request:
    paths:
      - "src/main.rs"
      - "src/bytecode_v2.rs"
      - "compiler/**"
      - ".github/workflows/self-hosted-bootstrap.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main, self-hosted-compiler-foundation]
    paths:
      - "src/main.rs"
      - "src/bytecode_v2.rs"
      - "compiler/**"
      - ".github/workflows/self-hosted-bootstrap.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-build-plan-bytecode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build from a fresh runner
        run: cargo build --locked --bins
      - name: Test plan adapter and bytecode verifier
        run: cargo test --locked self_hosted_plan_adapter
      - name: Emit and execute a plan-generated bytecode artifact
        shell: bash
        run: |
          set -euo pipefail
          cat > plan.json <<'PLAN'
          {
            "format": "ZENVORA_BYTECODE_PLAN_1",
            "main": [
              {"op":"push_const","type":"number","value":"40"},
              {"op":"push_const","type":"number","value":"2"},
              {"op":"binary","operator":"+"},
              {"op":"print"}
            ],
            "functions": []
          }
          PLAN
          target/debug/zv --emit-plan-bytecode-v2 plan.json plan.zv2b
          grep -F 'ZENVORA_BYTECODE 2' plan.zv2b
          target/debug/zv --run-bytecode plan.zv2b > output.txt
          grep -Fx '42' output.txt
