name: QORVYNT traffic history
on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qorvynt-traffic-history
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Collect GitHub traffic and append daily history
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, urllib.request, urllib.error
          token = os.environ.get("TRAFFIC_TOKEN")
          if not token:
              raise SystemExit("Missing TRAFFIC_TOKEN secret. Add a fine-grained token with Administration: read.")
          repo = os.environ["GITHUB_REPOSITORY"]
          headers = {"Accept":"application/vnd.github+json","Authorization":f"Bearer {token}","X-GitHub-Api-Version":"2022-11-28"}
          def get(endpoint):
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/traffic/{endpoint}", headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", "replace")
                  raise SystemExit(f"GitHub traffic API failed ({error.code}): {detail}")
          views, clones = get("views"), get("clones")
          path = "website/traffic-data.json"
          try:
              with open(path, encoding="utf-8") as handle:
                  history = json.load(handle)
          except FileNotFoundError:
              history = {"updated_at": None, "views": [], "clones": []}
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=45)
          def merge(old, incoming):
              by_day = {item["timestamp"]: item for item in old}
              for item in incoming:
                  by_day[item["timestamp"]] = {k:item[k] for k in ("timestamp","count","uniques")}
              return [by_day[key] for key in sorted(by_day) if datetime.datetime.fromisoformat(key.replace("Z","+00:00")) >= cutoff]
          history["views"] = merge(history.get("views", []), views.get("views", []))
          history["clones"] = merge(history.get("clones", []), clones.get("clones", []))
          history["updated_at"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          os.makedirs("website", exist_ok=True)
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(history, handle, indent=2)
              handle.write("\\n")
          print(f"Saved {len(history['views'])} view days and {len(history['clones'])} clone days.")
          PY
      - name: Commit updated traffic history
        run: |
          if git diff --quiet -- website/traffic-data.json; then
            echo "Traffic snapshot has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/traffic-data.json
          git commit -m "chore: update daily GitHub traffic history"
          git push
