name: QORVYNT Agent Validation

on:
  pull_request:
    paths:
      - "website/agent.html"
      - "website/api/**"
      - "website/package.json"
      - "docs/qorvynt-github-agent.md"
      - ".github/workflows/qorvynt-agent-check.yml"
  push:
    branches:
      - main
    paths:
      - "website/agent.html"
      - "website/api/**"
      - "website/package.json"
      - "docs/qorvynt-github-agent.md"
      - ".github/workflows/qorvynt-agent-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate API syntax
        working-directory: website
        run: node --check api/chat.js
      - name: Run API security and request tests
        working-directory: website
        run: npm run test:agent
      - name: Validate chat page and API contract
        run: |
          test -s website/agent.html
          grep -q 'id="messages"' website/agent.html
          grep -q "fetch('/api/chat'" website/agent.html
          grep -q 'QORVYNT_AGENT_API_KEY' website/api/chat.js
          grep -q 'Access-Control-Allow-Origin' website/api/chat.js
          grep -q 'AbortSignal.timeout' website/api/chat.js
          grep -q '"type": "module"' website/package.json
