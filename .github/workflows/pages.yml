name: Deploy QORVYNT website

on:
  push:
    branches:
      - main
      - chain-lang-integration
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qorvynt-pages-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website content
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate website files and navigation
        shell: bash
        run: |
          set -euo pipefail
          test -s website/index.html
          test -s website/playground.html
          test -s website/developers.html
          grep -q '<title>QORVYNT' website/index.html
          grep -q '<title>QORVYNT' website/playground.html
          grep -q '<title>QORVYNT Developers' website/developers.html
          grep -q 'playground.html' website/index.html
          grep -q 'developers.html' website/index.html
          grep -q 'developers.html' website/developers.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class VisibleText(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.hidden_depth = 0
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() in {"script", "style"}:
                      self.hidden_depth += 1

              def handle_endtag(self, tag):
                  if tag.lower() in {"script", "style"} and self.hidden_depth:
                      self.hidden_depth -= 1

              def handle_data(self, data):
                  if not self.hidden_depth:
                      self.parts.append(data)

          for filename in (
              "website/index.html",
              "website/playground.html",
              "website/developers.html",
          ):
              parser = VisibleText()
              parser.feed(Path(filename).read_text(encoding="utf-8"))
              visible = " ".join(parser.parts).casefold()
              if "zenvora" in visible:
                  raise SystemExit(f"retired Zenvora branding remains visible in {filename}")

          print("QORVYNT_PAGES_CONTENT_VALIDATION_PASS")
          PY

  deploy:
    name: Deploy GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
