name: Deploy QORVYNT website

on:
  push:
    branches:
      - main
      - chain-lang-integration
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qorvynt-pages-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website content
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate website files and navigation
        shell: bash
        run: |
          set -euo pipefail
          test -s website/index.html
          test -s website/playground.html
          test -s website/developers.html
          grep -q '<title>QORVYNT' website/index.html
          grep -q '<title>QORVYNT' website/playground.html
          grep -q '<title>QORVYNT Developers' website/developers.html
          grep -q 'playground.html' website/index.html
          grep -q 'developers.html' website/index.html
          grep -q 'developers.html' website/developers.html
          echo "QORVYNT_PAGES_CONTENT_VALIDATION_PASS"

  deploy:
    name: Deploy GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
