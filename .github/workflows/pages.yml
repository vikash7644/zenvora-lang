name: Deploy Zenvora website

on:
  push:
    branches:
      - main
      - chain-lang-integration
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate website files
        run: |
          test -s website/index.html
          test -s website/playground.html
          test -s website/game-2d.html
          grep -q '<title>' website/index.html
          grep -q 'playground.html' website/index.html
          grep -q 'game-2d.html' website/playground.html
          grep -q 'id="game"' website/game-2d.html
          grep -q 'keydown' website/game-2d.html
          grep -q 'data-dir' website/game-2d.html
          grep -q 'LEVEL COMPLETE' website/game-2d.html

      - name: Generate Google-compatible raster favicons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
          rsvg-convert -w 48 -h 48 website/zenvora-favicon.svg -o website/favicon-48.png
          convert website/favicon-48.png -define icon:auto-resize=16,32,48 website/favicon.ico
          test -s website/favicon-48.png
          test -s website/favicon.ico

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
