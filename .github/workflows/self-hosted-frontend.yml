name: QORVYNT self-hosted compiler and Bytecode v2 validation

on:
  pull_request:
    paths:
      - "compiler/parser.qv"
      - "compiler/bootstrap.qv"
      - "compiler/fixtures/runnable_sample.qv"
      - ".github/workflows/self-hosted-frontend.yml"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - main
    paths:
      - "compiler/parser.qv"
      - "compiler/bootstrap.qv"
      - ".github/workflows/self-hosted-frontend.yml"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qorvynt-self-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-hosted-parser-to-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust reference host
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run reference runtime regression suite
        run: cargo test --locked
      - name: Build reference VM host once
        run: cargo build --locked --bin zv
      - name: Execute QORVYNT-written compiler frontend
        shell: bash
        run: |
          set -euo pipefail
          target/debug/zv --compile-with-qorvynt compiler/parser.qv compiler/fixtures/runnable_sample.qv self-hosted-compiler-from-driver.zv2b > parser-output.txt
          grep -F 'ZENVORA_GENERIC_COMPILER_DRIVER_PASS' parser-output.txt
          grep -F 'ZENVORA_GENERIC_COMPILER_STAGES_PASS' parser-output.txt
          grep -F 'ZENVORA_GENERIC_COMPILER_COLLECTION_LOOP_PASS' parser-output.txt
          grep -F 'ZENVORA_MULTI_CONTROL_FLOW_PLAN_PASS' parser-output.txt
          grep -F 'ZENVORA_GENERIC_COMPILER_FUNCTION_SEMANTICS_PASS' parser-output.txt
          grep -F 'ZENVORA_PLAN_VERIFIER_MALFORMED_RECORD_AND_TARGET_PASS' parser-output.txt
          grep -F 'ZENVORA_NATIVE_BYTECODE_V2_EMIT_PASS' parser-output.txt
          grep -F 'QORVYNT_INPUT_PLAN_ALL_LINES_PASS' parser-output.txt
          ! grep -F 'QORVYNT_INPUT_PLAN_ALL_LINES_FAIL' parser-output.txt
          ! grep -F 'ZENVORA_NATIVE_BYTECODE_V2_EMIT_FAIL' parser-output.txt
          ! grep -F 'ZENVORA_PLAN_VERIFIER_MALFORMED_RECORD_AND_TARGET_FAIL' parser-output.txt
          ! grep -F 'ZENVORA_GENERIC_COMPILER_DRIVER_FAIL' parser-output.txt
          ! grep -F 'ZENVORA_GENERIC_COMPILER_STAGES_FAIL' parser-output.txt
          ! grep -F 'ZENVORA_GENERIC_COMPILER_COLLECTION_LOOP_FAIL' parser-output.txt
          ! grep -F 'ZENVORA_MULTI_CONTROL_FLOW_PLAN_FAIL' parser-output.txt
          ! grep -F 'ZENVORA_GENERIC_COMPILER_FUNCTION_SEMANTICS_FAIL' parser-output.txt
          ! grep -F 'compile_error' parser-output.txt
      - name: Translate QORVYNT plan JSON directly to canonical Bytecode v2
        shell: bash
        run: |
          set -euo pipefail
          awk '/^ZENVORA_BYTECODE_PLAN_JSON$/ { getline; print; exit }' parser-output.txt > self-hosted-plan.json
          test -s self-hosted-plan.json
          python3 -m json.tool self-hosted-plan.json >/dev/null
          awk '/^ZENVORA_BYTECODE_V2_JSON$/ { getline; print; exit }' parser-output.txt > self-hosted-native-v2.json
          python3 - <<'PY'
          import json
          with open("self-hosted-native-v2.json", encoding="utf-8") as source:
              bytecode = json.load(source)
          if not isinstance(bytecode, str) or not bytecode.startswith("ZENVORA_BYTECODE 2\n"):
              raise SystemExit("QORVYNT native emitter did not return canonical Bytecode v2 text")
          with open("self-hosted-native-v2.zv2b", "w", encoding="utf-8", newline="") as output:
              output.write(bytecode)
          PY
          target/debug/zv --emit-plan-bytecode-v2 self-hosted-plan.json self-hosted-compiler.zv2b
          cmp self-hosted-native-v2.zv2b self-hosted-compiler.zv2b
          grep -F 'ZENVORA_BYTECODE 2' self-hosted-compiler.zv2b
          target/debug/zv --run-bytecode self-hosted-compiler.zv2b > self-hosted-bytecode-output.txt
          target/debug/zv --run-bytecode self-hosted-native-v2.zv2b > self-hosted-native-v2-output.txt
          diff -u self-hosted-bytecode-output.txt self-hosted-native-v2-output.txt
          python3 - <<'PY'
          expected = [
              "14", "42", "7", "7", "120", "7", "3", "v", "true", "ZV",
              "2", "3", "true", "42", "2", "xv", "2", "5", "2", "42",
              "3", "720", "55", "256", "6", "25", "21", "18", "228", "29",
          ]
          with open("self-hosted-bytecode-output.txt", encoding="utf-8") as artifact:
              actual = artifact.read().splitlines()
          if actual != expected:
              raise SystemExit(f"internal Bytecode v2 regression mismatch:\\nexpected={expected!r}\\nactual={actual!r}")
          print("QORVYNT_PLAN_TO_BYTECODE_V2_EXECUTION_PASS")
          PY
          awk '/^QORVYNT_INPUT_BYTECODE_PLAN_JSON$/ { getline; print; exit }' parser-output.txt > self-hosted-input-plan.json
          test -s self-hosted-input-plan.json
          python3 -m json.tool self-hosted-input-plan.json >/dev/null
          awk '/^ZENVORA_INPUT_BYTECODE_V2_JSON$/ { getline; print; exit }' parser-output.txt > self-hosted-input-native-v2.json
          python3 - <<'PY'
          import json
          with open("self-hosted-input-native-v2.json", encoding="utf-8") as source:
              bytecode = json.load(source)
          if not isinstance(bytecode, str) or not bytecode.startswith("ZENVORA_BYTECODE 2\n"):
              raise SystemExit("QORVYNT input compiler did not return canonical Bytecode v2 text")
          with open("self-hosted-input-native-v2.zv2b", "w", encoding="utf-8", newline="") as output:
              output.write(bytecode)
          PY
          target/debug/zv --emit-plan-bytecode-v2 self-hosted-input-plan.json self-hosted-input-plan-adapter.zv2b
          cmp self-hosted-input-native-v2.zv2b self-hosted-input-plan-adapter.zv2b
          target/debug/zv --run-bytecode self-hosted-compiler-from-driver.zv2b > self-hosted-driver-output.txt
          target/debug/zv --run-bytecode self-hosted-input-plan-adapter.zv2b > self-hosted-input-plan-output.txt
          target/debug/zv --run-bytecode self-hosted-input-native-v2.zv2b > self-hosted-input-native-v2-output.txt
          diff -u self-hosted-input-plan-output.txt self-hosted-input-native-v2-output.txt
          diff -u self-hosted-driver-output.txt self-hosted-input-native-v2-output.txt
          python3 - <<'PY'
          expected = [
              "14", "42", "7", "7", "120", "7", "3", "v", "true", "ZV",
              "2", "3", "true", "42", "2", "xv", "2", "5", "2", "42",
              "3", "720", "55", "256", "6", "25", "21", "18", "228", "29",
              "-", "!", "not",
          ]
          with open("self-hosted-input-native-v2-output.txt", encoding="utf-8") as artifact:
              actual = artifact.read().splitlines()
          if actual != expected:
              raise SystemExit(f"caller-source Bytecode v2 execution mismatch:\\nexpected={expected!r}\\nactual={actual!r}")
          print("QORVYNT_CALLER_SOURCE_TO_BYTECODE_V2_PARITY_PASS")
          PY
      - name: Verify deterministic plan translation and Bytecode v2 artifact
        shell: bash
        run: |
          set -euo pipefail
          target/debug/zv --compile-with-qorvynt compiler/parser.qv compiler/fixtures/runnable_sample.qv self-hosted-compiler-from-driver-repeat.zv2b > parser-output-repeat.txt
          awk '/^ZENVORA_BYTECODE_PLAN_JSON$/ { getline; print; exit }' parser-output-repeat.txt > self-hosted-plan-repeat.json
          awk '/^ZENVORA_BYTECODE_V2_JSON$/ { getline; print; exit }' parser-output-repeat.txt > self-hosted-native-v2-repeat.json
          diff -u self-hosted-plan.json self-hosted-plan-repeat.json
          python3 - <<'PY'
          import json
          with open("self-hosted-native-v2-repeat.json", encoding="utf-8") as source:
              bytecode = json.load(source)
          with open("self-hosted-native-v2-repeat.zv2b", "w", encoding="utf-8", newline="") as output:
              output.write(bytecode)
          PY
          cmp self-hosted-native-v2.zv2b self-hosted-native-v2-repeat.zv2b
          target/debug/zv --emit-plan-bytecode-v2 self-hosted-plan-repeat.json self-hosted-compiler-repeat.zv2b
          cmp self-hosted-compiler.zv2b self-hosted-compiler-repeat.zv2b
          target/debug/zv --run-bytecode self-hosted-compiler-repeat.zv2b > self-hosted-bytecode-output-repeat.txt
          diff -u self-hosted-bytecode-output.txt self-hosted-bytecode-output-repeat.txt
          cmp self-hosted-compiler-from-driver.zv2b self-hosted-compiler-from-driver-repeat.zv2b
          target/debug/zv --emit-bytecode-v2 compiler/bootstrap.qv self-hosted-stage1-compiler.zv2b
          target/debug/zv --run-bytecode-with-source self-hosted-stage1-compiler.zv2b compiler/bootstrap.qv self-hosted-stage2-compiler.zv2b > self-hosted-stage2-output.txt || { cat self-hosted-stage2-output.txt; exit 1; }
          grep -F 'ZENVORA_INPUT_BYTECODE_V2_JSON' self-hosted-stage2-output.txt
          ! grep -F 'ZENVORA_INPUT_BYTECODE_V2_FAIL' self-hosted-stage2-output.txt
          target/debug/zv --run-bytecode-with-source self-hosted-stage2-compiler.zv2b compiler/bootstrap.qv self-hosted-stage3-compiler.zv2b > self-hosted-stage3-output.txt || { cat self-hosted-stage3-output.txt; exit 1; }
          grep -F 'ZENVORA_INPUT_BYTECODE_V2_JSON' self-hosted-stage3-output.txt
          ! grep -F 'ZENVORA_INPUT_BYTECODE_V2_FAIL' self-hosted-stage3-output.txt
          cmp self-hosted-stage2-compiler.zv2b self-hosted-stage3-compiler.zv2b
          echo 'QORVYNT_STAGE1_STAGE2_STAGE3_BOOTSTRAP_PASS'
          target/debug/zv --run-bytecode-with-source self-hosted-stage2-compiler.zv2b compiler/fixtures/runnable_sample.qv self-hosted-stage2-sample.zv2b > self-hosted-stage2-sample-output.txt
          cmp self-hosted-stage2-sample.zv2b self-hosted-native-v2.zv2b
