name: Zenvora self-hosted frontend smoke

on:
  pull_request:
    paths:
      - "compiler/token_stream.zv"
      - "compiler/parser.zv"
      - ".github/workflows/self-hosted-frontend.yml"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - main
      - self-hosted-compiler-foundation
    paths:
      - "compiler/token_stream.zv"
      - "compiler/parser.zv"
      - ".github/workflows/self-hosted-frontend.yml"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-hosted-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalized-token-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Compile Zenvora reference runtime
        run: cargo test --locked
      - name: Execute Zenvora-written token component
        run: |
          cargo run --locked --quiet -- compiler/token_stream.zv > frontend-output.txt
          cat frontend-output.txt
          grep -F 'keyword' frontend-output.txt
          grep -F 'operator' frontend-output.txt
          grep -F 'identifier' frontend-output.txt
          grep -F 'string' frontend-output.txt
          grep -F 'number' frontend-output.txt
          grep -F 'boolean' frontend-output.txt
          grep -F 'punctuation' frontend-output.txt
          grep -F 'error' frontend-output.txt
      - name: Execute Zenvora-written parser foundation
        run: |
          cargo run --locked --quiet -- compiler/parser.zv > parser-output.txt
          cat parser-output.txt
          grep -F 'binary' parser-output.txt
          grep -F 'and' parser-output.txt
          grep -F 'or' parser-output.txt
          grep -F 'unary' parser-output.txt
          grep -F 'call' parser-output.txt
          grep -F 'index' parser-output.txt
          grep -F 'define' parser-output.txt
          grep -F 'show' parser-output.txt
          grep -F 'assign' parser-output.txt
          grep -F 'return' parser-output.txt
          grep -F 'break' parser-output.txt
          grep -F 'continue' parser-output.txt
          grep -F 'if' parser-output.txt
          grep -F 'repeat' parser-output.txt
          grep -F 'function' parser-output.txt
          grep -F 'error' parser-output.txt
          grep -F 'expected expression' parser-output.txt
          grep -F 'expected literal, name, or parenthesized expression' parser-output.txt
          grep -F 'expected closing bracket after index' parser-output.txt
          grep -F 'expected closing parenthesis' parser-output.txt
          grep -F 'expected function parameter name' parser-output.txt
          grep -F 'expected closing brace' parser-output.txt
