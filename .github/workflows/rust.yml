name: Zenvora Lang CI

on:
  push:
    branches: [main, chain-lang-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenvora-lang-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-vm:
    name: Main compiler and bytecode VM
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check compilation
        run: cargo check --all-targets

      - name: Run Clippy lint checks
        run: cargo clippy --all-targets

      - name: Run all tests
        run: cargo test --all-targets

      - name: Run hello example
        run: cargo run -- examples/hello.zv

      - name: Run loop-control example
        run: cargo run -- examples/loops.zv

      - name: Run functions example
        run: cargo run -- examples/functions.zv

      - name: Run basic functions example #35
        run: cargo run -- examples/functions-basic.zv

      - name: Run functions summary example #36
        run: cargo run -- examples/functions-summary.zv

      - name: Run booleans example
        run: cargo run -- examples/booleans.zv

      - name: Run strings example
        run: cargo run -- examples/strings.zv

      - name: Run collections example
        run: cargo run -- examples/collections.zv

      - name: Run direct indexing example
        run: cargo run -- examples/indexing.zv

      - name: Run standard library example
        run: cargo run -- examples/stdlib.zv

      - name: Run string standard library example
        run: cargo run -- examples/stdlib-strings.zv

      - name: Run contract DSL example
        run: cargo run -- examples/contracts.zv

      - name: Run Zenvora Lang transaction-rule checks
        run: cargo run -- examples/chain_transfer.zv

      - name: Run module import example
        run: cargo run -- examples/modules.zv

      - name: Compile example to bytecode
        run: cargo run -- --emit-bytecode examples/functions.zv /tmp/zenvora-functions.zvb

      - name: Execute compiled bytecode
        run: cargo run -- --run-bytecode /tmp/zenvora-functions.zvb

      - name: Compile example to experimental Bytecode v2
        run: cargo run -- --emit-bytecode-v2 examples/functions.zv /tmp/zenvora-functions.zv2b

      - name: Execute verified Bytecode v2 and compare output
        shell: bash
        run: |
          output="$(cargo run -- --run-bytecode /tmp/zenvora-functions.zv2b)"
          printf -v expected '2026\n1\n2\n3\n42'
          if [[ "$output" != "$expected" ]]; then
            printf 'Unexpected Bytecode v2 output:\n%s\n' "$output"
            exit 1
          fi

      - name: Verify CLI version
        run: cargo run -- --version

      - name: Verify CLI help
        run: cargo run -- --help
      - name: Smoke-test Rust compiler HTTP API
        shell: bash
        run: |
          cargo run -- --compiler-api 18787 > /tmp/zenvora-compiler-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18787/health > /tmp/zenvora-api-health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"service":"zenvora-compiler-api"' /tmp/zenvora-api-health.json
          curl --silent --show-error --fail \
            -H 'Content-Type: application/json' \
            --data '{"source":"define a := 10\ndefine b := 20\nshow a + b\nshow a * 2"}' \
            http://127.0.0.1:18787/compile-run > /tmp/zenvora-api-result.json
          grep -q '"output":"30\\n20"' /tmp/zenvora-api-result.json
          curl --silent --show-error --fail \
            -H 'Content-Type: application/json' \
            --data '{"source":"show missing_variable"}' \
            http://127.0.0.1:18787/compile-run > /tmp/zenvora-api-error.json
          grep -q '"ok":false' /tmp/zenvora-api-error.json

  interpreter-mvp:
    name: Interpreter MVP regression suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> compiler/target

      - name: Check interpreter compilation
        run: cargo check --all-targets

      - name: Run interpreter Clippy checks
        run: cargo clippy --all-targets

      - name: Run interpreter tests
        run: cargo test --all-targets

      - name: Run shared hello example
        run: cargo run -- ../examples/hello.zv
