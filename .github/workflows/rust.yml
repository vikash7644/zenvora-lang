name: QORVYNT CI

on:
  push:
    branches: [main, chain-lang-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qorvynt-lang-ci-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-vm:
    name: Main compiler and bytecode VM
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Enforce canonical QORVYNT source extension
        run: bash scripts/check_qv_extension.sh

      - name: Check compilation
        run: cargo check --locked --all-targets

      - name: Run Clippy lint checks
        run: cargo clippy --locked --all-targets

      - name: Run all tests
        run: cargo test --locked --all-targets

      - name: Build optimized release CLI
        run: cargo build --locked --release --bin qorvynt

      - name: Validate distributable Rust package
        run: cargo package --locked

      - name: Validate QUR Web3 manifest
        run: cargo run --locked -- --qur-check examples/qur/manifest.qv
      - name: Validate machine-readable QUR manifest output
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -- --qur-json examples/qur/manifest.qv > /tmp/qorvynt-qur.json
          python3 -c 'import json; d=json.load(open("/tmp/qorvynt-qur.json")); assert d["schema"] == "qorvynt.qur.manifest.v1" and d["valid"] is True; assert len(d["chains"]) == 1 and d["chains"][0]["name"] == "MyChain"; assert d["tokens"][0]["supply"] == 100000000; assert d["wallets"][0]["network"] == "MyChain"'
          set +e
          cargo run --locked -- --qur-json examples/qur/invalid-wallet.qv > /tmp/qorvynt-qur-invalid.json
          invalid_status=$?
          set -e
          test "$invalid_status" -eq 1
          python3 -c 'import json; d=json.load(open("/tmp/qorvynt-qur-invalid.json")); assert d["schema"] == "qorvynt.qur.manifest.v1" and d["valid"] is False; assert "unknown chain" in d["error"]'

      - name: Exercise QUR token genesis, transfer, and rollback
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -- --qur-token-init examples/qur/manifest.qv /tmp/qorvynt-token-ledger.json
          cargo run --locked -- --qur-token-transfer /tmp/qorvynt-token-ledger.json GOLD genesis alice 25
          cargo run --locked -- --qur-token-balance /tmp/qorvynt-token-ledger.json GOLD alice | grep -Fxq 25
          set +e
          cargo run --locked -- --qur-token-transfer /tmp/qorvynt-token-ledger.json GOLD alice bob 26
          transfer_status=$?
          set -e
          test "$transfer_status" -eq 1
          cargo run --locked -- --qur-token-balance /tmp/qorvynt-token-ledger.json GOLD alice | grep -Fxq 25

      - name: Exercise QUR QVM-metered token transfer and rollback
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -- --qur-token-init examples/qur/manifest.qv /tmp/qorvynt-qvm-ledger.json
          cargo run --locked -- --qur-token-transfer-qvm /tmp/qorvynt-qvm-ledger.json /tmp/qorvynt-qvm-state.bin qur_tokens GOLD genesis alice 25 30000 | tee /tmp/qorvynt-qvm-receipt.txt
          grep -Fxq "event=TokenTransfer" /tmp/qorvynt-qvm-receipt.txt
          grep -Eq "^execution_state_root=[0-9a-f]{64}$" /tmp/qorvynt-qvm-receipt.txt
          grep -Fxq "event_token=GOLD event_from=genesis event_to=alice event_amount=25" /tmp/qorvynt-qvm-receipt.txt
          cargo run --locked -- --qur-token-balance /tmp/qorvynt-qvm-ledger.json GOLD alice | grep -Fxq 25
          set +e
          cargo run --locked -- --qur-token-transfer-qvm /tmp/qorvynt-qvm-ledger.json /tmp/qorvynt-qvm-state.bin qur_tokens GOLD alice bob 1 21001
          transfer_status=$?
          set -e
          test "$transfer_status" -eq 1
          cargo run --locked -- --qur-token-balance /tmp/qorvynt-qvm-ledger.json GOLD alice | grep -Fxq 25

      - name: Exercise QUR DAO proposal, voting, quorum, and persistence
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -- --chain-keygen /tmp/qorvynt-dao-alice.qvk
          cargo run --locked -- --chain-keygen /tmp/qorvynt-dao-bob.qvk
          cargo run --locked -- --chain-keygen /tmp/qorvynt-dao-carol.qvk
          cargo run --locked -- --qur-dao-propose /tmp/qorvynt-dao-state.bin community proposal1 founder "Fund public goods" 2 30000
          cargo run --locked -- --qur-dao-vote-signed /tmp/qorvynt-dao-state.bin community proposal1 /tmp/qorvynt-dao-alice.qvk yes 30000
          cargo run --locked -- --qur-dao-vote-signed /tmp/qorvynt-dao-state.bin community proposal1 /tmp/qorvynt-dao-bob.qvk yes 30000
          set +e
          cargo run --locked -- --qur-dao-vote-signed /tmp/qorvynt-dao-state.bin community proposal1 /tmp/qorvynt-dao-bob.qvk no 30000
          duplicate_status=$?
          set -e
          test "$duplicate_status" -eq 1
          cargo run --locked -- --qur-dao-finalize /tmp/qorvynt-dao-state.bin community proposal1 30000
          cargo run --locked -- --qur-dao-show /tmp/qorvynt-dao-state.bin community proposal1 > /tmp/qorvynt-dao-proposal.json
          python3 -c 'import json; p=json.load(open("/tmp/qorvynt-dao-proposal.json")); assert p["status"] == "approved" and p["yes_votes"] == 2 and p["no_votes"] == 0 and p["quorum"] == 2'
          cargo run --locked -- --qur-dao-propose /tmp/qorvynt-dao-state.bin community proposal2 alice "Treasury policy" 3 30000
          cargo run --locked -- --qur-dao-vote-signed /tmp/qorvynt-dao-state.bin community proposal2 /tmp/qorvynt-dao-carol.qvk yes 30000
          cargo run --locked -- --qur-dao-finalize /tmp/qorvynt-dao-state.bin community proposal2 30000
          cargo run --locked -- --qur-dao-show /tmp/qorvynt-dao-state.bin community proposal2 > /tmp/qorvynt-dao-quorum.json
          python3 -c 'import json; p=json.load(open("/tmp/qorvynt-dao-quorum.json")); assert p["status"] == "quorum_not_met"'
          cargo run --locked -- --qur-dao-treasury-fund /tmp/qorvynt-dao-state.bin community 100 30000
          cargo run --locked -- --qur-dao-propose-treasury /tmp/qorvynt-dao-state.bin community treasury1 founder "Pay contributor" contributor 40 1 5 30000
          set +e
          cargo run --locked -- --qur-dao-vote-signed /tmp/qorvynt-dao-state.bin community treasury1 /tmp/qorvynt-dao-alice.qvk yes 30000
          unanchored_vote_status=$?
          cargo run --locked -- --qur-dao-finalize-height /tmp/qorvynt-dao-state.bin community treasury1 100 30000
          legacy_finalize_status=$?
          cargo run --locked -- --qur-dao-treasury-execute /tmp/qorvynt-dao-state.bin community treasury1 105 30000
          legacy_execute_status=$?
          set -e
          test "$unanchored_vote_status" -ne 0
          test "$legacy_finalize_status" -ne 0
          test "$legacy_execute_status" -ne 0
          cargo run --locked -- --qur-dao-show /tmp/qorvynt-dao-state.bin community treasury1 > /tmp/qorvynt-dao-treasury.json
          python3 -c 'import json; p=json.load(open("/tmp/qorvynt-dao-treasury.json")); assert p["status"] == "open" and p["yes_votes"] == 0 and p["executed"] is False'
          cargo run --locked -- --qur-dao-treasury-balance /tmp/qorvynt-dao-state.bin community | grep -Fxq 100
          cargo run --locked -- --chain-keygen /tmp/qorvynt-dao-anchor-validator.qvk
          cargo run --locked -- --chain-store-init /tmp/qorvynt-dao-anchor-store.qvb 98765 /tmp/qorvynt-dao-anchor-validator.qvk 100
          cargo run --locked -- --qur-dao-propose-treasury-anchored /tmp/qorvynt-dao-anchored-state.bin /tmp/qorvynt-dao-anchor-store.qvb 98765 0 community anchored1 founder "Anchored contributor payout" recipient 40 1 5 30000
          cargo run --locked -- --qur-dao-vote-signed /tmp/qorvynt-dao-anchored-state.bin community anchored1 /tmp/qorvynt-dao-alice.qvk yes 30000
          cargo run --locked -- --qur-dao-show /tmp/qorvynt-dao-anchored-state.bin community anchored1 > /tmp/qorvynt-dao-anchored-proposal.json
          python3 -c 'import json; p=json.load(open("/tmp/qorvynt-dao-anchored-proposal.json")); assert p["snapshot_chain_id"] == 98765 and p["snapshot_block_height"] == 0 and len(p["snapshot_block_hash"]) == 64 and len(p["snapshot_chain_state_root"]) == 64 and p["yes_votes"] == 1 and p["status"] == "open"'
      - name: Test token-weighted DAO wallet voting
        shell: bash
        run: |
          set -euo pipefail
          yes_address=$(cargo run --quiet --locked -- --chain-keygen /tmp/qorvynt-weighted-yes.qvk | sed -n 's/^Address: //p')
          no_address=$(cargo run --quiet --locked -- --chain-keygen /tmp/qorvynt-weighted-no.qvk | sed -n 's/^Address: //p')
          test -n "$yes_address"
          test -n "$no_address"
          cargo run --locked -- --qur-token-init examples/qur/manifest.qv /tmp/qorvynt-weighted-ledger.json
          cargo run --locked -- --qur-token-transfer /tmp/qorvynt-weighted-ledger.json GOLD genesis "$yes_address" 70
          cargo run --locked -- --qur-token-transfer /tmp/qorvynt-weighted-ledger.json GOLD genesis "$no_address" 30
          cargo run --locked -- --qur-dao-propose-weighted /tmp/qorvynt-weighted-ledger.json /tmp/qorvynt-weighted-state.bin community weighted1 founder "Weighted governance vote" GOLD 100 50000
          cargo run --locked -- --qur-token-transfer /tmp/qorvynt-weighted-ledger.json GOLD "$yes_address" "$no_address" 70
          cargo run --locked -- --qur-dao-vote-weighted /tmp/qorvynt-weighted-state.bin community weighted1 /tmp/qorvynt-weighted-yes.qvk GOLD yes 100000
          cargo run --locked -- --qur-dao-vote-weighted /tmp/qorvynt-weighted-state.bin community weighted1 /tmp/qorvynt-weighted-no.qvk GOLD no 100000
          cargo run --locked -- --qur-dao-show /tmp/qorvynt-weighted-state.bin community weighted1 > /tmp/qorvynt-weighted-proposal.json
          python3 -c 'import json; p=json.load(open("/tmp/qorvynt-weighted-proposal.json")); assert p["yes_votes"] == 70 and p["no_votes"] == 30 and p["quorum"] == 100; assert len(p["snapshot_ledger_root"]) == 64 and len(p["voting_snapshot_root"]) == 64'
      - name: Test replay-anchored weighted DAO proposal CLI
        shell: bash
        run: |
          set -euo pipefail
          validator_address=$(cargo run --quiet --locked -- --chain-keygen /tmp/qorvynt-anchor-validator.qvk | sed -n 's/^Address: //p')
          test -n "$validator_address"
          cargo run --locked -- --chain-store-init /tmp/qorvynt-anchor-blocks.jsonl 777 /tmp/qorvynt-anchor-validator.qvk 1000000
          cargo run --locked -- --qur-token-init examples/qur/manifest.qv /tmp/qorvynt-anchor-ledger.json
          cargo run --locked -- --qur-token-transfer /tmp/qorvynt-anchor-ledger.json GOLD genesis "$validator_address" 100
          cargo run --locked -- --qur-dao-propose-weighted-anchored /tmp/qorvynt-anchor-ledger.json /tmp/qorvynt-anchor-state.bin /tmp/qorvynt-anchor-blocks.jsonl 777 community anchor1 founder "Replay anchored governance" GOLD 100 100000
          cargo run --locked -- --qur-dao-show /tmp/qorvynt-anchor-state.bin community anchor1 > /tmp/qorvynt-anchor-proposal.json
          python3 -c 'import json; p=json.load(open("/tmp/qorvynt-anchor-proposal.json")); assert p["snapshot_chain_id"] == 777 and p["snapshot_block_height"] == 0; assert len(p["snapshot_block_hash"]) == 64 and len(p["snapshot_chain_state_root"]) == 64; assert len(p["snapshot_ledger_root"]) == 64 and len(p["voting_snapshot_root"]) == 64'

      - name: Execute DAO treasury payout against QUR token ledger
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -- --qur-token-init examples/qur/manifest.qv /tmp/qorvynt-dao-native-ledger.json
          cargo run --locked -- --qur-token-transfer /tmp/qorvynt-dao-native-ledger.json GOLD genesis dao_community 100
          cargo run --locked -- --qur-dao-propose-treasury /tmp/qorvynt-dao-native-state.bin community nativepayout founder "Native token contributor payout" contributor 40 1 5 30000
          set +e
          cargo run --locked -- --qur-dao-vote-signed /tmp/qorvynt-dao-native-state.bin community nativepayout /tmp/qorvynt-dao-alice.qvk yes 30000
          unanchored_vote_status=$?
          cargo run --locked -- --qur-dao-finalize-height /tmp/qorvynt-dao-native-state.bin community nativepayout 100 30000
          legacy_finalize_status=$?
          cargo run --locked -- --qur-dao-treasury-token-execute /tmp/qorvynt-dao-native-ledger.json /tmp/qorvynt-dao-native-state.bin community nativepayout GOLD 105 50000
          legacy_token_execute_status=$?
          set -e
          test "$unanchored_vote_status" -ne 0
          test "$legacy_finalize_status" -ne 0
          test "$legacy_token_execute_status" -ne 0
          cargo run --locked -- --qur-dao-show /tmp/qorvynt-dao-native-state.bin community nativepayout > /tmp/qorvynt-dao-native-proposal.json
          python3 -c 'import json; p=json.load(open("/tmp/qorvynt-dao-native-proposal.json")); assert p["status"] == "open" and p["yes_votes"] == 0 and p["executed"] is False'
          cargo run --locked -- --qur-token-balance /tmp/qorvynt-dao-native-ledger.json GOLD dao_community | grep -Fxq 100
          cargo run --locked -- --qur-token-balance /tmp/qorvynt-dao-native-ledger.json GOLD contributor | grep -Fxq 0
      - name: Execute every QORVYNT example
        run: bash scripts/check_examples.sh

      - name: Test persistent contract CLI, gas, and rollback
        run: bash scripts/test_contract_cli.sh

      - name: Test contract ABI and bytecode artifact CLI
        run: bash scripts/test_contract_artifact.sh

      - name: Smoke-test optimized release CLI version
        run: ./target/release/qorvynt --version

      - name: Smoke-test optimized release example
        run: ./target/release/qorvynt examples/hello.qv | grep -Fxq 35

      - name: Run hello example
        run: cargo run --locked -- examples/hello.qv

      - name: Run QORVYNT language tour
        run: cargo run --locked -- examples/qorvynt-language-tour.qv

      - name: Run loop-control example
        run: cargo run --locked -- examples/loops.qv

      - name: Run functions example
        run: cargo run --locked -- examples/functions.qv

      - name: Run basic functions example #35
        run: cargo run --locked -- examples/functions-basic.qv

      - name: Run functions summary example #36
        run: cargo run --locked -- examples/functions-summary.qv

      - name: Run booleans example
        run: cargo run --locked -- examples/booleans.qv

      - name: Run strings example
        run: cargo run --locked -- examples/strings.qv

      - name: Run collections example
        run: cargo run --locked -- examples/collections.qv

      - name: Run direct indexing example
        run: cargo run --locked -- examples/indexing.qv

      - name: Run standard library example
        run: cargo run --locked -- examples/stdlib.qv

      - name: Run string standard library example
        run: cargo run --locked -- examples/stdlib-strings.qv

      - name: Run contract DSL example
        run: cargo run --locked -- examples/contracts.qv

      - name: Run QORVYNT transaction-rule checks
        run: cargo run --locked -- examples/chain_transfer.qv

      - name: Run module import example
        run: cargo run --locked -- examples/modules.qv

      - name: Compile example to bytecode v1
        run: cargo run --locked -- --emit-bytecode examples/functions.qv /tmp/qorvynt-functions.qvb

      - name: Execute compiled bytecode v1
        run: cargo run --locked -- --run-bytecode /tmp/qorvynt-functions.qvb

      - name: Compile example to experimental bytecode v2
        run: cargo run --locked -- --emit-bytecode-v2 examples/functions.qv /tmp/qorvynt-functions.qv2b

      - name: Check bytecode v2 header
        run: grep -q '^QORVYNT_BYTECODE 2$' /tmp/qorvynt-functions.qv2b

      - name: Execute verified bytecode v2
        run: cargo run --locked -- --run-bytecode /tmp/qorvynt-functions.qv2b
      - name: Compile and execute a QVM artifact
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -- --qvm-compile examples/hello.qv /tmp/qorvynt-hello.qvmb
          grep -q '^QORVYNT_BYTECODE 2$' /tmp/qorvynt-hello.qvmb
          cargo run --locked -- examples/hello.qv > /tmp/qorvynt-source-output.txt
          cargo run --locked -- --qvm-run /tmp/qorvynt-hello.qvmb > /tmp/qorvynt-qvm-output.txt
          diff -u /tmp/qorvynt-source-output.txt /tmp/qorvynt-qvm-output.txt

      - name: Verify CLI version
        run: cargo run --locked -- --version

      - name: Verify CLI help
        run: cargo run --locked -- --help

      - name: Smoke-test Rust compiler HTTP API
        shell: bash
        run: |
          cargo run --locked -- --compiler-api 18787 > /tmp/qorvynt-compiler-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18787/health > /tmp/qorvynt-api-health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"service":"qorvynt-compiler-api"' /tmp/qorvynt-api-health.json
          curl --silent --show-error --fail \
            -H 'Content-Type: application/json' \
            --data '{"source":"define a := 10\ndefine b := 20\nshow a + b\nshow a * 2"}' \
            http://127.0.0.1:18787/compile-run > /tmp/qorvynt-api-result.json
          grep -Fq '"output":"30\n20"' /tmp/qorvynt-api-result.json
          curl --silent --show-error --fail \
            -H 'Content-Type: application/json' \
            --data '{"source":"show missing_variable"}' \
            http://127.0.0.1:18787/compile-run > /tmp/qorvynt-api-error.json
          grep -q '"ok":false' /tmp/qorvynt-api-error.json
  interpreter-mvp:
    name: Interpreter MVP regression suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> compiler/target

      - name: Check interpreter compilation
        run: cargo check --all-targets

      - name: Run interpreter Clippy checks
        run: cargo clippy --all-targets

      - name: Run interpreter tests
        run: cargo test --all-targets

      - name: Run shared hello example
        run: cargo run -- ../examples/hello.qv

  editor-support:
    name: Validate QORVYNT editor support
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate VS Code metadata and TextMate grammar
        run: python scripts/check_vscode_extension.py

      - name: Set up Node.js for VSIX packaging
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Package installable VS Code extension
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce package --no-dependencies --out qorvynt.vsix

      - name: Upload VS Code extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: qorvynt-vscode-extension
          path: editors/vscode/qorvynt.vsix
          if-no-files-found: error
          retention-days: 7
