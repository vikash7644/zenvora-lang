name: Zenvora Lang CI

on:
  push:
    branches: [main, chain-lang-integration, self-hosted-compiler-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenvora-lang-ci-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-vm:
    name: Main compiler and bytecode VM
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check compilation
        run: cargo check --locked --all-targets

      - name: Run Clippy lint checks
        run: cargo clippy --locked --all-targets

      - name: Run all tests
        run: cargo test --locked --all-targets

      - name: Build optimized release CLI
        run: cargo build --locked --release --bin zv

      - name: Validate distributable Rust package
        run: cargo package --locked

      - name: Execute every Zenvora Lang example
        run: bash scripts/check_examples.sh

      - name: Test persistent contract CLI, gas, and rollback
        run: bash scripts/test_contract_cli.sh

      - name: Test contract ABI and bytecode artifact CLI
        run: bash scripts/test_contract_artifact.sh

      - name: Smoke-test optimized release CLI version
        run: ./target/release/zv --version

      - name: Smoke-test optimized release example
        run: ./target/release/zv examples/hello.zv | grep -Fxq 35

      - name: Run hello example
        run: cargo run --locked -- examples/hello.zv

      - name: Run Zenvora Lang language tour
        run: cargo run --locked -- examples/zenvora-language-tour.zv

      - name: Export Zenvora-authored game level through the VM
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/zv examples/game-2d-level.zv > /tmp/zenvora-game-level-vm.txt
          grep -Fx 'ZENVORA_GAME_LEVEL_V1' /tmp/zenvora-game-level-vm.txt
          python scripts/export_game_level.py examples/game-2d-level.zv /tmp/zenvora-game-scene.json --zv ./target/release/zv
          python - <<'PY'
          import json
          from pathlib import Path
          scene = json.loads(Path('/tmp/zenvora-game-scene.json').read_text())
          assert scene['format'] == 'ZENVORA_GAME_SCENE_V1'
          assert scene['world'] == {'width': 10, 'height': 8}
          assert scene['spawn'] == {'x': 1, 'y': 1}
          assert scene['goal'] == {'x': 8, 'y': 6}
          assert len(scene['walls']) == 9
          print('Zenvora VM -> validated game scene JSON: PASS')
          PY

      - name: Execute Zenvora-authored game script through the VM
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/zv examples/game-2d-scripted.zv > /tmp/zenvora-game-source-output.txt
          ./target/release/zv --emit-bytecode-v2 examples/game-2d-scripted.zv /tmp/zenvora-game-script.zv2b
          ./target/release/zv --run-bytecode /tmp/zenvora-game-script.zv2b > /tmp/zenvora-game-bytecode-output.txt
          diff -u /tmp/zenvora-game-source-output.txt /tmp/zenvora-game-bytecode-output.txt
          python scripts/export_game_level.py examples/game-2d-scripted.zv /tmp/zenvora-scripted-scene.json --zv ./target/release/zv
          python - <<'PY'
          import json
          from pathlib import Path
          scene = json.loads(Path('/tmp/zenvora-scripted-scene.json').read_text())
          assert scene['format'] == 'ZENVORA_GAME_SCENE_V1'
          assert len(scene['script']) == 12, scene['script']
          assert scene['script'][:3] == ['down'] * 3
          assert scene['script'][3:10] == ['right'] * 7
          assert scene['script'][10:] == ['down'] * 2
          assert len(scene['trace']) == len(scene['script']) == 12
          x, y = scene['spawn']['x'], scene['spawn']['y']
          for direction, state in zip(scene['script'], scene['trace']):
              x += {'left': -1, 'right': 1}.get(direction, 0)
              y += {'up': -1, 'down': 1}.get(direction, 0)
              assert state == {'x': x, 'y': y}, (direction, state, x, y)
          assert scene['trace'][-1] == scene['goal']
          print('Zenvora source -> grid_step VM builtin -> per-frame state trace -> validated Canvas scene: PASS')
          PY

      - name: Run 2D grid game smoke test
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- examples/game-2d-grid.zv > /tmp/zenvora-2d-grid-game.txt
          grep -Fx 'ZENVORA 2D GRID QUEST' /tmp/zenvora-2d-grid-game.txt
          grep -Fx 'LEVEL COMPLETE' /tmp/zenvora-2d-grid-game.txt
          cat /tmp/zenvora-2d-grid-game.txt

      - name: Run 3D wireframe smoke test
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- examples/game-3d-wireframe.zv > /tmp/zenvora-3d-wireframe.txt
          grep -Fx 'ZENVORA 3D WIREFRAME' /tmp/zenvora-3d-wireframe.txt
          grep -Fx '3D SCENE COMPLETE' /tmp/zenvora-3d-wireframe.txt
          cat /tmp/zenvora-3d-wireframe.txt

      - name: Verify 2D game source and bytecode v2 output parity
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- examples/game-2d-grid.zv > /tmp/zenvora-2d-source.txt
          cargo run --locked --quiet -- --emit-bytecode-v2 examples/game-2d-grid.zv /tmp/zenvora-2d-grid.zv2b
          cargo run --locked --quiet -- --run-bytecode /tmp/zenvora-2d-grid.zv2b > /tmp/zenvora-2d-bytecode.txt
          diff -u /tmp/zenvora-2d-source.txt /tmp/zenvora-2d-bytecode.txt

      - name: Verify 3D wireframe source and bytecode v2 output parity
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -- examples/game-3d-wireframe.zv > /tmp/zenvora-3d-source.txt
          cargo run --locked --quiet -- --emit-bytecode-v2 examples/game-3d-wireframe.zv /tmp/zenvora-3d-wireframe.zv2b
          cargo run --locked --quiet -- --run-bytecode /tmp/zenvora-3d-wireframe.zv2b > /tmp/zenvora-3d-bytecode.txt
          diff -u /tmp/zenvora-3d-source.txt /tmp/zenvora-3d-bytecode.txt

      - name: Run loop-control example
        run: cargo run --locked -- examples/loops.zv

      - name: Run functions example
        run: cargo run --locked -- examples/functions.zv

      - name: Run basic functions example #35
        run: cargo run --locked -- examples/functions-basic.zv

      - name: Run functions summary example #36
        run: cargo run --locked -- examples/functions-summary.zv

      - name: Run booleans example
        run: cargo run --locked -- examples/booleans.zv

      - name: Run strings example
        run: cargo run --locked -- examples/strings.zv

      - name: Run collections example
        run: cargo run --locked -- examples/collections.zv

      - name: Run direct indexing example
        run: cargo run --locked -- examples/indexing.zv

      - name: Run standard library example
        run: cargo run --locked -- examples/stdlib.zv

      - name: Run string standard library example
        run: cargo run --locked -- examples/stdlib-strings.zv

      - name: Run contract DSL example
        run: cargo run --locked -- examples/contracts.zv

      - name: Run Zenvora Lang transaction-rule checks
        run: cargo run --locked -- examples/chain_transfer.zv

      - name: Run module import example
        run: cargo run --locked -- examples/modules.zv

      - name: Compile example to bytecode v1
        run: cargo run --locked -- --emit-bytecode examples/functions.zv /tmp/zenvora-functions.zvb

      - name: Execute compiled bytecode v1
        run: cargo run --locked -- --run-bytecode /tmp/zenvora-functions.zvb

      - name: Compile example to experimental bytecode v2
        run: cargo run --locked -- --emit-bytecode-v2 examples/functions.zv /tmp/zenvora-functions.zv2b

      - name: Check bytecode v2 header
        run: grep -q '^ZENVORA_BYTECODE 2$' /tmp/zenvora-functions.zv2b

      - name: Execute verified bytecode v2
        run: cargo run --locked -- --run-bytecode /tmp/zenvora-functions.zv2b

      - name: Verify CLI version
        run: cargo run --locked -- --version

      - name: Verify CLI help
        run: cargo run --locked -- --help

      - name: Smoke-test Rust compiler HTTP API
        shell: bash
        run: |
          cargo run --locked -- --compiler-api 18787 > /tmp/zenvora-compiler-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18787/health > /tmp/zenvora-api-health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"service":"zenvora-compiler-api"' /tmp/zenvora-api-health.json
          curl --silent --show-error --fail \
            -H 'Content-Type: application/json' \
            --data '{"source":"define a := 10\ndefine b := 20\nshow a + b\nshow a * 2"}' \
            http://127.0.0.1:18787/compile-run > /tmp/zenvora-api-result.json
          grep -q '"output":"30\\n20"' /tmp/zenvora-api-result.json
          curl --silent --show-error --fail \
            -H 'Content-Type: application/json' \
            --data '{"source":"show missing_variable"}' \
            http://127.0.0.1:18787/compile-run > /tmp/zenvora-api-error.json
          grep -q '"ok":false' /tmp/zenvora-api-error.json

  interpreter-mvp:
    name: Interpreter MVP regression suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> compiler/target

      - name: Check interpreter compilation
        run: cargo check --all-targets

      - name: Run interpreter Clippy checks
        run: cargo clippy --all-targets

      - name: Run interpreter tests
        run: cargo test --all-targets

      - name: Run shared hello example
        run: cargo run -- ../examples/hello.zv

  editor-support:
    name: Validate Zenvora editor support
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate VS Code metadata and TextMate grammar
        run: python scripts/check_vscode_extension.py

      - name: Set up Node.js for VSIX packaging
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate graphical browser game and JavaScript syntax
        run: python scripts/check_game_page.py

      - name: Package installable VS Code extension
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce package --no-dependencies --out zenvora-lang.vsix

      - name: Upload VS Code extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenvora-vscode-extension
          path: editors/vscode/zenvora-lang.vsix
          if-no-files-found: error
          retention-days: 7
