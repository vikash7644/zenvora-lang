name: Zenvora Lang CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check
      - name: Test
        run: cargo test
      - name: Run loop-control example
        run: cargo run -- examples/loops.zv
      - name: Run functions example
        run: cargo run -- examples/functions.zv
