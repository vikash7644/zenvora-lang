name: QORVYNT Studio (Windows)

on:
  pull_request:
    paths:
      - "studio/**"
      - ".github/workflows/studio-windows.yml"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-shell:
    name: Build and package Studio on Windows
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build standalone QORVYNT CLI
        run: cargo build --locked --release --bin qorvynt

      - name: Upload standalone QORVYNT CLI
        uses: actions/upload-artifact@v4
        with:
          name: qorvynt-cli-windows-x64
          path: target/release/qorvynt.exe
          if-no-files-found: error
          retention-days: 14

      - name: Install frontend dependencies
        working-directory: studio
        run: npm install

      - name: Build Windows installers
        working-directory: studio
        run: npm run tauri:build

      - name: Upload MSI and NSIS installers
        uses: actions/upload-artifact@v4
        with:
          name: qorvynt-studio-windows-installers
          path: |
            studio/src-tauri/target/release/bundle/msi/*.msi
            studio/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
