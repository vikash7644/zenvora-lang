name: Zenvora Interpreter MVP

on:
  push:
    branches: [main]
    paths:
      - "compiler/**"
      - "examples/**"
      - ".github/workflows/zenvora-lang.yml"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "compiler/**"
      - "examples/**"
      - ".github/workflows/zenvora-lang.yml"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenvora-interpreter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interpreter:
    name: Compile and test interpreter MVP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache interpreter build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler -> compiler/target

      - name: Check all interpreter targets
        run: cargo check --all-targets

      - name: Run interpreter regression tests
        run: cargo test --all-targets

      - name: Execute shared hello example
        run: cargo run -- ../examples/hello.zv
