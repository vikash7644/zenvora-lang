name: Zenvora Lang checks
on:
  push:
    paths:
      - "compiler/**"
      - "examples/**"
      - ".github/workflows/zenvora-lang.yml"
  pull_request:
    paths:
      - "compiler/**"
      - "examples/**"
      - ".github/workflows/zenvora-lang.yml"
  workflow_dispatch:

jobs:
  rust-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo run -- ../examples/hello.zv
