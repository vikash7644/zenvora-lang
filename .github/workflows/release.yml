name: Build Zenvora Lang release artifacts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check compilation
        run: cargo check --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Build optimized CLI
        run: cargo build --locked --release --bin zv

      - name: Smoke-test release CLI
        run: ./target/release/zv examples/hello.zv | grep -Fxq 35

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --locked --release --bin zv --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/zv" dist/zv
          cp README.md dist/README.md
          cp LICENSE dist/LICENSE
          tar -czf "dist/zenvora-lang-${{ matrix.name }}.tar.gz" -C dist zv README.md LICENSE
          rm dist/zv dist/README.md dist/LICENSE

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/zv.exe" "dist/zv.exe"
          Copy-Item README.md "dist/README.md"
          Copy-Item LICENSE "dist/LICENSE"
          Compress-Archive -Path dist/zv.exe,dist/README.md,dist/LICENSE -DestinationPath "dist/zenvora-lang-${{ matrix.name }}.zip" -Force
          Remove-Item dist/zv.exe,dist/README.md,dist/LICENSE

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/zenvora-lang-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub pre-release
    if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-prototype]'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish pre-release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.8.0-prototype.1' }}
          target_commitish: main
          name: Zenvora Lang v0.8.0 Prototype 1
          prerelease: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
