name: QORVYNT Contract Runtime Checks

on:
  push:
    branches:
      - qorvynt-contract-tx-foundation
  pull_request:
    paths:
      - "src/contract_protocol.rs"
      - "src/contract_executor.rs"
      - "src/contract_runtime.rs"
      - "src/contract_state.rs"
      - "src/contract_gas.rs"
      - "src/main.rs"
      - ".github/workflows/contract-protocol.yml"

permissions:
  contents: read

concurrency:
  group: qorvynt-contract-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-contract-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Test signed transactions, QVM2 contract runtime, storage and fees
        run: cargo test --locked contract_ -- --nocapture
