name: QORVYNT GitHub Agent

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: qorvynt-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reply:
    if: >-
      github.event.issue.pull_request == null &&
      ((github.event_name == 'issues' && contains(github.event.issue.body, '@qorvynt')) ||
       (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@qorvynt')))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Reply as QORVYNT Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QORVYNT_AGENT_API_KEY: ${{ secrets.QORVYNT_AGENT_API_KEY }}
          QORVYNT_AGENT_BASE_URL: ${{ vars.QORVYNT_AGENT_BASE_URL }}
          QORVYNT_AGENT_MODEL: ${{ vars.QORVYNT_AGENT_MODEL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: node .github/scripts/qorvynt-agent.mjs
